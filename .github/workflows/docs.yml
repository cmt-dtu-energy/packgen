name: docs

on:
  push:
    branches: [main]
  pull_request:
    paths: ["docs/**", "src/**", "mkdocs.yml", "pyproject.toml", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # push the built site to the gh-pages branch
    env:
      NO_MKDOCS_2_WARNING: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true

      # The API reference is built from static analysis of src/, so neither
      # packgen nor bpy needs to be installed.
      - name: Build
        run: uv run --only-group docs mkdocs build --strict

      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: uv run --only-group docs mkdocs gh-deploy --force --no-history
